# Начало рабочего дня
work-hours-start=10

# Завершение рабочего дня
work-hours-end=18

# Список user_id аккаунтов MAX, которые должны иметь доступ к административным функциям.
# Формат: число, число
admins-by-id=-1
max-token=${MAX_TOKEN}

# URL для подключения к БД
jdbc-url=jdbc:sqlite:./database.db

# Путь к внешнему файлу TLS-сертификата (PKCS12)
certificate-path=cert.p12

# Пароль к TLS-сертификату
certificate-password=java

# Публичный URL webhook для регистрации в MAX
webhook-url=https://domain

# Версия приложения
app-version=${version}