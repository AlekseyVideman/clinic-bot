  %s
notification.template: "%s, здравствуйте! Напоминаю вам о приеме к стоматологу."

# Help
help.admin: |
  # Введение

  **Определения**
  Пациент — тот, кто получает уведомления.
  Администратор — работник клиники.


  # Рабочий процесс

  **Добавление записи**
  1. Спросите пациента, зарегистрирован ли он в боте. Если нет, попросите перейти в бота и далее зарегистрироваться.
  1. Выполните команду `/%s`, чтобы запустить процесс добавления записи.
  1. Введите требуемые данные.
  1. Бот проверит данные и добавит запись.

  **Просмотр следующих записей**
  1. Выполните команду `/%s`.
  1. Бот выведет список следующих записей на 14 дней вперёд.

  **Автоматическое удаление записи**
  Бот удаляет неактуальные записи на следующий день после последнего уведомления.
help.patient: |
  # Как получать уведомления?
  1. Зарегистрируйтесь, если не сделали этого ранее.
  2. Не закрывайте эту переписку.

  # Я не смогу прийти. Что делать?
  1. Отмените запись, выполнив команду `/%s`.

