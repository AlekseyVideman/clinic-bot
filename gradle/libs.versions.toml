[versions]
max-bot-api = "0.5.0"
tinylog = "2.7.0"

[libraries]
lombok = { group = "org.projectlombok", name = "lombok", version = "1.18.46" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version = "3.0.6" }
mybatis = { module = "org.mybatis:mybatis", version = "3.5.19" }
flyway = { module = "org.flywaydb:flyway-core", version = "13.3.0" }
hikari = { module = "com.zaxxer:HikariCP", version = "7.1.0" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version = "3.53.2.1" }
groovy-test = { module = "org.apache.groovy:groovy", version = "5.0.4" }
spock-core-test = { module = "org.spockframework:spock-core", version = "2.4-groovy-5.0" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "6.0.3" }
max-bot-api-client = { module = "ru.etsft.max:max-bot-api-client", version.ref = "max-bot-api" }
max-bot-api-jackson = { module = "ru.etsft.max:max-bot-api-jackson", version.ref = "max-bot-api" }
max-bot-api-webhook = { module = "ru.etsft.max:max-bot-api-webhook", version.ref = "max-bot-api" }
ez-vcard = { module = "com.googlecode.ez-vcard:ez-vcard", version = "0.12.2" }
jspecify = { module = "org.jspecify:jspecify", version = "1.0.1" }
slf4j-tinylog = { module = "org.tinylog:slf4j-tinylog", version.ref = "tinylog" }
tinylog = { module = "org.tinylog:tinylog-impl", version.ref = "tinylog" }
db-scheduler = { module = "com.github.kagkarlsson:db-scheduler", version = "16.12.0" }

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.4.2" }

[bundles]
database = ["hikari", "flyway", "mybatis", "sqlite-jdbc"]
testing = ["groovy-test", "spock-core-test"]
max = ["max-bot-api-client", "max-bot-api-jackson", "max-bot-api-webhook"]
logging = ["tinylog", "slf4j-tinylog"]